spring.application.name=deliveryfacil-api
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:1433;databaseName=DeliveryFacil;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:troque_esta_senha}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# o esquema é criado pelos scripts da pasta /database
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jackson.default-property-inclusion=non_null
delivery.sla-preparo-minutos=30
delivery.sla.varredura-ms=60000
delivery.pix.varredura-ms=60000
